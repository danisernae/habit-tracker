<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hábitos — Hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#BC3157}a:hover{color:#8E2242}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #3B1424; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 12px">

    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 500; color: #7A5A66; text-transform: uppercase; letter-spacing: 0.08em">Domingo, 18 de octubre</div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em">Hoy</h1>
      </div>
      <a href="NuevoHabito.dc.html" aria-label="Nuevo hábito" style="width: 44px; height: 44px; border-radius: 22px; background: #3B1424; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; padding: 16px 18px; background: #FFFFFF; border-radius: 24px; border: 1.5px solid #EFE6E1">
      <div style="position: relative; width: 76px; height: 76px; flex-shrink: 0">
        <svg role="img" aria-label="{{ringLabel}}" width="76" height="76" viewBox="0 0 76 76">
          <circle cx="38" cy="38" r="32" fill="none" stroke="#F3E9E4" stroke-width="9"/>
          <circle cx="38" cy="38" r="32" fill="none" stroke="#BC3157" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 38 38)"/>
        </svg>
        <div style="position: absolute; top: 0; left: 0; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{pct}}%</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1">{{message}}</div>
        <div style="font-size: 14px; color: #7A5A66">{{doneCount}} de 5 hábitos cumplidos</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 9px; border-radius: 16px; {{d.boxStyle}}">
          <div style="font-size: 11px; font-weight: 700; opacity: 0.75">{{d.letter}}</div>
          <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 1">{{d.num}}</div>
          <div style="display: flex; gap: 2px">
            <sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="5">
              <div style="width: 6px; height: 6px; border-radius: 3px; {{dot.style}}"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Mis hábitos</h2>
      <div style="font-size: 13px; color: #7A5A66">Toca para marcar</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{habits}}" as="h" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; height: 64px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 22px; {{h.cardStyle}}">
          <div style="width: 44px; height: 44px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{h.iconBoxStyle}}">
            <sc-if value="{{h.icAgua}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 4.5-6 7.8-6 11a6 6 0 0 0 12 0c0-3.2-2.5-6.5-6-11z"/></svg></sc-if>
            <sc-if value="{{h.icEjer}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg></sc-if>
            <sc-if value="{{h.icDieta}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l8-8"/></svg></sc-if>
            <sc-if value="{{h.icAzucar}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M4 4l16 16"/></svg></sc-if>
            <sc-if value="{{h.icSkin}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15v5M16.5 17.5h5"/></svg></sc-if>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="font-weight: 700; font-size: 16px">{{h.name}}</div>
            <div style="font-size: 13px; opacity: 0.8">{{h.meta}} · racha {{h.streak}} días</div>
          </div>
          <button onClick="{{h.toggle}}" aria-label="{{h.btnLabel}}" aria-pressed="{{h.done}}" style="width: 44px; height: 44px; border-radius: 22px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{h.btnStyle}}">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{h.checkColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegación" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 16px 22px; background: #FFFFFF; border-top: 1.5px solid #EFE6E1">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #BC3157; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      Hoy
    </a>
    <a href="Mes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #7A5A66; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Mes
    </a>
    <a href="Resumen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #7A5A66; font-size: 12px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      Resumen
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var HABITS = [
  { id: 'agua', name: 'Tomar agua', meta: '8 vasos', color: '#A9CCEA', lightText: false, icon: 'icAgua' },
  { id: 'ejercicio', name: 'Hacer ejercicio', meta: '30 min', color: '#BC3157', lightText: true, icon: 'icEjer' },
  { id: 'dieta', name: 'Seguir la dieta', meta: 'Plan del día', color: '#EAD6AE', lightText: false, icon: 'icDieta' },
  { id: 'azucar', name: 'Sin azúcar', meta: 'Todo el día', color: '#EBB6C9', lightText: false, icon: 'icAzucar' },
  { id: 'skin', name: 'Skin care', meta: 'Mañana y noche', color: '#C6B5E2', lightText: false, icon: 'icSkin' }
];
var RATE = [8, 6, 7, 5, 9];
function hit(h, d, m) {
  var x = (d * 7 + h * 13 + ((d * (h + 3)) % 5) + m * 3) % 10;
  return x < RATE[h];
}
var TODAY = 18;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: HABITS.map(function (_, i) { return hit(i, TODAY, 10); }) };
  }
  toggle(i) {
    var next = this.state.done.slice();
    next[i] = !next[i];
    this.setState({ done: next });
  }
  renderVals() {
    var self = this;
    var done = this.state.done;
    var doneCount = done.filter(Boolean).length;
    var pct = Math.round((doneCount / HABITS.length) * 100);
    var circ = 2 * Math.PI * 32;
    var message = doneCount === 5 ? '¡Día perfecto!' : doneCount >= 3 ? '¡Vas muy bien!' : doneCount >= 1 ? 'Vas arrancando' : 'Empieza por uno';

    var habits = HABITS.map(function (h, i) {
      var isDone = done[i];
      var streak = isDone ? 1 : 0;
      for (var d = TODAY - 1; d >= 1 && hit(i, d, 10); d--) streak++;
      var item = {
        name: h.name, meta: h.meta, streak: streak, done: isDone ? 'true' : 'false',
        btnLabel: (isDone ? 'Desmarcar ' : 'Marcar ') + h.name,
        cardStyle: isDone
          ? 'background:' + h.color + ';color:' + (h.lightText ? '#FFFFFF' : '#3B1424') + ';border:1.5px solid ' + h.color
          : 'background:#FFFFFF;color:#3B1424;border:1.5px solid #EFE6E1',
        iconBoxStyle: isDone
          ? 'background:rgba(255,255,255,0.4);color:' + (h.lightText ? '#FFFFFF' : '#3B1424')
          : 'background:' + h.color + ';color:' + (h.lightText ? '#FFFFFF' : '#3B1424'),
        btnStyle: isDone
          ? (h.lightText ? 'background:#FFFFFF;border:none' : 'background:#3B1424;border:none')
          : 'background:transparent;border:2px solid #D9CCC6',
        checkColor: isDone ? (h.lightText ? h.color : '#FFFFFF') : '#D9CCC6',
        toggle: function () { self.toggle(i); }
      };
      item.icAgua = h.icon === 'icAgua'; item.icEjer = h.icon === 'icEjer'; item.icDieta = h.icon === 'icDieta';
      item.icAzucar = h.icon === 'icAzucar'; item.icSkin = h.icon === 'icSkin';
      return item;
    });

    var letters = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    var week = letters.map(function (l, k) {
      var day = 12 + k;
      var isToday = day === TODAY;
      return {
        letter: l, num: day,
        boxStyle: isToday ? 'background:#3B1424;color:#FFFFFF' : 'background:#FFFFFF;color:#3B1424;border:1.5px solid #EFE6E1',
        dots: HABITS.map(function (h, i) {
          var ok = isToday ? done[i] : hit(i, day, 10);
          return { style: ok ? 'background:' + h.color : (isToday ? 'background:rgba(255,255,255,0.22)' : 'background:#EFE6E1') };
        })
      };
    });

    return {
      habits: habits, week: week, doneCount: doneCount, pct: pct, message: message,
      dash: (circ * pct / 100).toFixed(1) + ' ' + circ.toFixed(1),
      ringLabel: 'Progreso de hoy: ' + pct + '%'
    };
  }
}
</script>
</body>
</html>
