<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hábitos — Nuevo hábito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#BC3157}a:hover{color:#8E2242}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #3B1424; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 24px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #EFE6E1; background: #FFFFFF; color: #3B1424; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Nuevo hábito</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 72px; box-sizing: border-box; padding: 0 14px 0 12px; border-radius: 24px; {{previewStyle}}">
    <div style="width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <sc-if value="{{ic0}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 4.5-6 7.8-6 11a6 6 0 0 0 12 0c0-3.2-2.5-6.5-6-11z"/></svg></sc-if>
      <sc-if value="{{ic1}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg></sc-if>
      <sc-if value="{{ic2}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l8-8"/></svg></sc-if>
      <sc-if value="{{ic3}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M4 4l16 16"/></svg></sc-if>
      <sc-if value="{{ic4}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15v5M16.5 17.5h5"/></svg></sc-if>
      <sc-if value="{{ic5}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6.5c2.5-2 5.5-2 8-1v13c-2.5-1-5.5-1-8 1-2.5-2-5.5-2-8-1z"/><path d="M12 6.5v13"/></svg></sc-if>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <div style="font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{displayName}}</div>
      <div style="font-size: 13px; opacity: 0.85">{{freqText}}</div>
    </div>
    <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; border: 2px solid currentColor; opacity: 0.45; flex-shrink: 0"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="nombre" style="font-size: 14px; font-weight: 700">Nombre</label>
    <input id="nombre" type="text" value="{{name}}" onChange="{{setName}}" placeholder="Ej: Leer 10 páginas" style="box-sizing: border-box; width: 100%; height: 50px; border-radius: 16px; border: 1.5px solid #E3D6D0; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #3B1424">
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div id="lbl-color" style="font-size: 14px; font-weight: 700">Color</div>
    <div role="group" aria-labelledby="lbl-color" style="display: flex; gap: 10px">
      <sc-for list="{{colors}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" style="width: 52px; height: 52px; border-radius: 26px; padding: 0; cursor: pointer; background: {{c.hex}}; {{c.ring}}"></button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div id="lbl-icono" style="font-size: 14px; font-weight: 700">Ícono</div>
    <div role="group" aria-labelledby="lbl-icono" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="6">
        <button onClick="{{i.pick}}" aria-label="{{i.label}}" aria-pressed="{{i.pressed}}" style="height: 48px; border-radius: 16px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #3B1424; {{i.style}}">
          <sc-if value="{{i.k0}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.5 4.5-6 7.8-6 11a6 6 0 0 0 12 0c0-3.2-2.5-6.5-6-11z"/></svg></sc-if>
          <sc-if value="{{i.k1}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg></sc-if>
          <sc-if value="{{i.k2}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l8-8"/></svg></sc-if>
          <sc-if value="{{i.k3}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M4 4l16 16"/></svg></sc-if>
          <sc-if value="{{i.k4}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15v5M16.5 17.5h5"/></svg></sc-if>
          <sc-if value="{{i.k5}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6.5c2.5-2 5.5-2 8-1v13c-2.5-1-5.5-1-8 1-2.5-2-5.5-2-8-1z"/><path d="M12 6.5v13"/></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div id="lbl-dias" style="font-size: 14px; font-weight: 700">¿Qué días?</div>
    <div role="group" aria-labelledby="lbl-dias" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.toggle}}" aria-label="{{d.label}}" aria-pressed="{{d.pressed}}" style="height: 44px; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0; {{d.style}}">{{d.letter}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 1.5px solid #EFE6E1; border-radius: 20px; padding: 10px 12px 10px 16px">
    <div style="display: flex; flex-direction: column; gap: 1px">
      <div style="font-weight: 700; font-size: 15px">Recordatorio</div>
      <div style="font-size: 13px; color: #7A5A66">Todos los días a las 8:00 p. m.</div>
    </div>
    <button onClick="{{toggleRemind}}" role="switch" aria-checked="{{remindOn}}" aria-label="Recordatorio" style="width: 56px; height: 34px; border-radius: 17px; border: none; padding: 3px; cursor: pointer; display: flex; {{switchStyle}}">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; display: block"></span>
    </button>
  </div>

  <a href="Main.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #3B1424; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 16px">Guardar hábito</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var COLORS = [
  { hex: '#A9CCEA', label: 'Azul cielo', lightText: false },
  { hex: '#BC3157', label: 'Mora', lightText: true },
  { hex: '#EAD6AE', label: 'Avena', lightText: false },
  { hex: '#EBB6C9', label: 'Rosa chicle', lightText: false },
  { hex: '#C6B5E2', label: 'Lila', lightText: false }
];
var ICONS = ['Gota de agua', 'Pesa', 'Hoja', 'Sin azúcar', 'Brillo', 'Libro'];
var DAYS = [
  { letter: 'L', label: 'Lunes' }, { letter: 'M', label: 'Martes' }, { letter: 'M', label: 'Miércoles' },
  { letter: 'J', label: 'Jueves' }, { letter: 'V', label: 'Viernes' }, { letter: 'S', label: 'Sábado' }, { letter: 'D', label: 'Domingo' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Leer 10 páginas', color: 4, icon: 5, days: [true, true, true, true, true, true, true], remind: true };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var col = COLORS[s.color];
    var ink = col.lightText ? '#FFFFFF' : '#3B1424';
    var activeDays = s.days.filter(Boolean).length;
    var freqText = activeDays === 7 ? 'Todos los días' : activeDays === 0 ? 'Elige al menos un día' : activeDays + ' días por semana';

    var vals = {
      name: s.name,
      displayName: s.name && s.name.trim() ? s.name : 'Tu nuevo hábito',
      freqText: freqText,
      previewStyle: 'background:' + col.hex + ';color:' + ink,
      setName: function (e) { self.setState({ name: e.target.value }); },
      colors: COLORS.map(function (c, k) {
        var on = s.color === k;
        return {
          hex: c.hex, label: c.label, pressed: on ? 'true' : 'false',
          ring: on ? 'border:3px solid #FBF7F2;box-shadow:0 0 0 2.5px #3B1424' : 'border:3px solid #FBF7F2;box-shadow:0 0 0 1px #E3D6D0',
          pick: function () { self.setState({ color: k }); }
        };
      }),
      icons: ICONS.map(function (label, k) {
        var on = s.icon === k;
        var item = {
          label: label, pressed: on ? 'true' : 'false',
          style: on ? 'background:' + col.hex + ';border:2px solid #3B1424;color:' + ink : 'background:#FFFFFF;border:1.5px solid #EFE6E1',
          pick: function () { self.setState({ icon: k }); }
        };
        for (var j = 0; j < 6; j++) item['k' + j] = j === k;
        return item;
      }),
      days: DAYS.map(function (d, k) {
        var on = s.days[k];
        return {
          letter: d.letter, label: d.label, pressed: on ? 'true' : 'false',
          style: on ? 'background:#3B1424;color:#FFFFFF;border:1.5px solid #3B1424' : 'background:#FFFFFF;color:#7A5A66;border:1.5px solid #EFE6E1',
          toggle: function () { var nd = s.days.slice(); nd[k] = !nd[k]; self.setState({ days: nd }); }
        };
      }),
      remindOn: s.remind ? 'true' : 'false',
      switchStyle: s.remind ? 'background:#BC3157;justify-content:flex-end' : 'background:#D9CCC6;justify-content:flex-start',
      toggleRemind: function () { self.setState({ remind: !s.remind }); }
    };
    for (var j = 0; j < 6; j++) vals['ic' + j] = s.icon === j;
    return vals;
  }
}
</script>
</body>
</html>
